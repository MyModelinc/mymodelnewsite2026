<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}
    body{font-family:'Manrope',sans-serif;background:#0F0B1A;color:#eeedf2;position:relative}
    .glow{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}.g1{width:520px;height:520px;right:-110px;top:-180px;background:rgba(124,58,237,.30)}.g2{width:440px;height:440px;left:-180px;bottom:-260px;background:rgba(236,72,153,.18)}
    .frame{position:absolute;inset:28px;border:1px solid rgba(167,139,250,.22);border-radius:28px;padding:52px 62px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,rgba(35,29,48,.28),rgba(15,11,26,.08))}
    .brand{font-size:30px;font-weight:800;letter-spacing:-.04em}.brand .my{color:#eeedf2}.brand .model{color:#8B5CF6}
    .eyebrow{display:inline-flex;align-items:center;width:max-content;font-size:14px;font-weight:700;letter-spacing:.04em;color:#eeedf2;background:rgba(167,139,250,.22);border:1px solid rgba(167,139,250,.4);border-radius:999px;padding:7px 16px}
    h1{font-size:72px;line-height:1.04;letter-spacing:-.045em;margin:22px 0 18px;max-width:900px;font-weight:800}.gradient{background:linear-gradient(135deg,#EC4899 0%,#A78BFA 50%,#7C3AED 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    p{font-size:24px;line-height:1.45;margin:0;max-width:910px;color:#eeedf2;font-weight:400}
    .footer{display:flex;justify-content:space-between;align-items:end;color:#b0adc2;font-size:16px}.line{width:180px;height:3px;border-radius:999px;background:linear-gradient(90deg,#EC4899,#7C3AED)}
  </style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <main class="frame">
    <div class="brand"><span class="my">my</span><span class="model">model</span></div>
    <section>
      <div class="eyebrow">THE PAID CONSENT MARKETPLACE FOR CONSUMER DATA</div>
      <h1>A Better Market for<br><span class="gradient">Consumer Data.</span></h1>
      <p>Reach a new market. Understand what drives it.<br>Put that intelligence to work in your campaigns.</p>
    </section>
    <div class="footer"><div class="line"></div><div>getmymodel.com/brands</div></div>
  </main>
</body>
</html>
